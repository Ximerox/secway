# Brute-Force gegen Portal-Kennwoerter oder Admin-Login von SecWay.
type: leaky
name: secway/bf
description: "Brute-Force gegen SecWay-Portal/Admin"
filter: "evt.Meta.log_type == 'secway_auth_failed'"
groupby: evt.Meta.source_ip
capacity: 5
leakspeed: "2m"
blackhole: 10m
labels:
  service: secway
  confidence: 3
  spoofable: 0
  classification:
    - attack.T1110
  behavior: "http:bruteforce"
  label: "SecWay Brute-Force"
  remediation: true
